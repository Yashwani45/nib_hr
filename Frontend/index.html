<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/shortlogo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechnoVani HRMS</title>
    <script>
      // Prevent React 19 DevTools DataCloneError when profiling components with large props or streams
      if (typeof window !== "undefined" && window.performance) {
        if (typeof window.performance.measure === "function") {
          const _origMeasure = window.performance.measure.bind(window.performance);
          window.performance.measure = function (name, startOrMeasureOptions, endMark) {
            try {
              return _origMeasure(name, startOrMeasureOptions, endMark);
            } catch (err) {
              if (startOrMeasureOptions && typeof startOrMeasureOptions === "object") {
                try {
                  const { detail, ...safeOptions } = startOrMeasureOptions;
                  return _origMeasure(name, safeOptions, endMark);
                } catch (_) {}
              }
              return null;
            }
          };
        }
        if (typeof window.performance.mark === "function") {
          const _origMark = window.performance.mark.bind(window.performance);
          window.performance.mark = function (name, markOptions) {
            try {
              return _origMark(name, markOptions);
            } catch (err) {
              if (markOptions && typeof markOptions === "object") {
                try {
                  const { detail, ...safeOptions } = markOptions;
                  return _origMark(name, safeOptions);
                } catch (_) {}
              }
              try {
                return _origMark(name);
              } catch (_) {}
              return null;
            }
          };
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
